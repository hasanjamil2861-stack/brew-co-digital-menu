<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#fffefa" />
  <title>BREW CO. | Digital Menu</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&amp;family=Poppins:wght@400;500;600;700&amp;display=swap" rel="stylesheet" />
    <!-- Loading screen styles -->
  <link rel="stylesheet" href="loader.css" />
  <!-- Menu styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!-- ===================== LOADING SCREEN ===================== -->
  <div class="loader" id="loader" aria-hidden="true">
    <div class="loader-content">

      <!-- Cup with rings, coffee and steam -->
      <div class="loader-cup-box">
        <span class="loader-ring"></span>
        <span class="loader-ring loader-ring-2"></span>
        <span class="loader-glow"></span>

        <svg class="loader-cup" viewBox="0 -14 40 48">
          <defs>
            <!-- Coffee stays inside the cup -->
            <clipPath id="cupInside">
              <path d="M6 9h24v6.5A11.5 11.5 0 0 1 18.5 27h-1A11.5 11.5 0 0 1 6 15.5V9Z"/>
            </clipPath>
          </defs>

          <!-- Coffee + foam -->
          <g clip-path="url(#cupInside)">
            <rect class="cup-coffee" x="5" y="12" width="26" height="16"/>
            <rect class="cup-foam" x="5" y="11" width="26" height="1.6"/>
          </g>

          <!-- Steam -->
          <path class="steam steam-1" d="M14 5c-2-2.5 2-4.5 0-7s2-4.5 0-7"/>
          <path class="steam steam-2" d="M19 5c-2-2.5 2-4.5 0-7s2-4.5 0-7"/>
          <path class="steam steam-3" d="M24 5c-2-2.5 2-4.5 0-7s2-4.5 0-7"/>

          <!-- Cup lines (same as the logo) -->
          <path class="cup-line cup-line-body" pathLength="100" d="M6 9h24v6.5A11.5 11.5 0 0 1 18.5 27h-1A11.5 11.5 0 0 1 6 15.5V9Z"/>
          <path class="cup-line cup-line-handle" pathLength="100" d="M30 12h2.2a4.3 4.3 0 0 1 0 8.6H28.6"/>
          <path class="cup-line cup-line-plate" pathLength="100" d="M7 31.5h22"/>
        </svg>
      </div>

      <!-- Brand name (each letter animates) -->
      <p class="loader-name">
        <span>B</span><span>R</span><span>E</span><span>W</span><span class="loader-space"></span><span>C</span><span>O</span><span>.</span>
      </p>
      <p class="loader-subtitle">COFFEE &amp; MORE</p>

      <!-- Progress bar -->
      <div class="loader-progress">
        <div class="loader-bar">
          <div class="loader-bar-fill" id="loaderFill"></div>
        </div>
        <div class="loader-info">
          <span>Brewing your menu<span class="loader-dots"><span>.</span><span>.</span><span>.</span></span></span>
          <span class="loader-percent" id="loaderPercent">0%</span>
        </div>
      </div>
    </div>
  </div>
  <script src="js/loader.js"></script>

  <!-- Header -->
  <header class="site-header">
    <div class="container topbar">
      <span class="header-icon menu-symbol" aria-hidden="true">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h17M3.5 12h17M3.5 17.5h17" /></svg>
      </span>
      <a class="brand" href="index.html" aria-label="Brew Co. Coffee and More, home">
        <svg class="brand-cup" viewBox="0 0 40 34" aria-hidden="true">
          <path d="M19 2.5v2.5"/>
          <path d="M6 9h24v6.5A11.5 11.5 0 0 1 18.5 27h-1A11.5 11.5 0 0 1 6 15.5V9Z"/>
          <path d="M30 12h2.2a4.3 4.3 0 0 1 0 8.6H28.6"/>
          <path d="M7 31.5h22"/>
        </svg>
        <span class="brand-name">BREW CO.</span>
        <span class="brand-subtitle">COFFEE &amp; MORE</span>
      </a>
      <span class="header-icon cart-symbol" role="img" aria-label="Shopping cart, 0 items">
        <svg viewBox="0 0 28 28" aria-hidden="true">
          <path d="M2.5 4.5h3.2l2.8 13.6a2.2 2.2 0 0 0 2.2 1.8h10.6a2.2 2.2 0 0 0 2.1-1.6l2.1-8.8H7.2"/>
          <circle cx="11.2" cy="24" r="1.7"/><circle cx="20.8" cy="24" r="1.7"/>
        </svg>
        <span class="cart-count" aria-hidden="true">0</span>
      </span>
    </div>
  </header>

  <main class="container">
    <!-- Hero -->
    <section class="hero" aria-labelledby="hero-heading">
      <div class="hero-copy">
        <h1 id="hero-heading">Good Coffee,<br /><span>Good Day.</span></h1>
        <p>Made with love, just for you.</p>
        <span class="heart" aria-hidden="true">♡</span>
      </div>
      <div class="hero-image">
        <img src="assets/hero-latte.jpg" fetchpriority="high" alt="Latte with leaf latte art, biscuits and coffee beans" />
      </div>
    </section>

    <!-- Menu title -->
    <div class="menu-title"><span></span><h2>MENU</h2><span></span></div>

    <!-- Categories are added from home.js -->
    <div id="menu"></div>
  </main>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <aside class="delivery-banner">
        <span class="delivery-icon" aria-hidden="true">
          <svg viewBox="0 0 44 34"><rect x="5" y="6" width="11" height="9" rx="1.5"/><path d="M10.5 6v9M4 20.5c0-3 2.4-5 5.5-5H19l2.5 6H4.5"/><path d="M14 27h14M21.5 21.5 28 27M28 27l3-13.5h-4.5M26.5 13.5h6"/><circle cx="9" cy="27" r="3.6"/><circle cx="35" cy="27" r="3.6"/><path d="M31 14l4 9.5"/></svg>
        </span>
        <div class="delivery-copy"><h3>We deliver to you!</h3><p>Fast &amp; fresh to your door.</p></div>
        <span class="delivery-arrow" aria-hidden="true">›</span>
      </aside>
    </div>
  </footer>

  <!-- Menu scripts (render.js first) -->
  <script src="js/render.js"></script>
  <script src="js/home.js"></script>
</body>
</html>
